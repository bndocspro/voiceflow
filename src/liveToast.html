<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VoiceFlow Live Caption</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans Bengali', 'Segoe UI', 'Nirmala UI', 'Vrinda', sans-serif;
    }

    /* Toast slide/fade entrance */
    #wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      opacity: 0;
      transform: translateY(8px) scale(0.97);
      transition: opacity 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #wrap.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Dark glass pill */
    #pill {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      background: rgba(15, 23, 42, 0.93);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 15px;
      padding: 10px 15px;
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Final "typed" state: emerald confirm */
    #pill.final {
      background: rgba(7, 48, 36, 0.94);
      border-color: rgba(52, 211, 153, 0.38);
      box-shadow: 0 12px 32px -8px rgba(6, 78, 59, 0.55), 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Live waveform bars */
    #bars {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 16px;
      flex-shrink: 0;
    }
    #bars span {
      width: 3px;
      height: 5px;
      border-radius: 2px;
      background: #34D399;
      animation: toastBar 1.05s infinite ease-in-out;
    }
    #bars span:nth-child(1) { animation-delay: 0s; }
    #bars span:nth-child(2) { animation-delay: 0.18s; }
    #bars span:nth-child(3) { animation-delay: 0.36s; }
    #bars span:nth-child(4) { animation-delay: 0.54s; }
    @keyframes toastBar {
      0%, 100% { height: 5px; }
      50% { height: 15px; }
    }
    #pill.final #bars span {
      animation: none;
      height: 4px;
      background: #6EE7B7;
    }
    #pill.idle #bars span {
      animation: none;
      height: 5px;
      background: #94A3B8;
    }

    /* Real-time transcription text */
    #text {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 500;
      color: rgba(241, 245, 249, 0.92);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    #pill.status #text {
      color: rgba(148, 163, 184, 0.95);
      font-weight: 400;
    }
    #pill.final #text {
      color: #A7F3D0;
    }

    /* Blinking emerald caret */
    #caret {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #34D399;
      margin-left: 2px;
      vertical-align: -2px;
      border-radius: 1px;
      animation: toastBlink 1s infinite;
    }
    @keyframes toastBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    #pill.final #caret,
    #pill.status #caret { display: none; }

    /* Confirm check icon */
    #check {
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #6EE7B7;
    }
    #pill.final #check { display: flex; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="pill" class="status">
      <div id="bars"><span></span><span></span><span></span><span></span></div>
      <div id="text">Listening…</div><span id="caret"></span>
      <div id="check">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const invoke = window.__TAURI__?.core?.invoke || (async () => {});
    const listenEvent = window.__TAURI__?.event?.listen || null;

    const wrapEl = document.getElementById("wrap");
    const pillEl = document.getElementById("pill");
    const textEl = document.getElementById("text");

    let fadeTimer = null;
    let hideTimer = null;

    function setState(kind, text) {
      clearTimeout(fadeTimer);
      clearTimeout(hideTimer);
      wrapEl.classList.add("visible");
      pillEl.classList.remove("final", "status", "idle");
      textEl.textContent = text || "";

      if (kind === "final") {
        // Confirmed phrase: emerald flash, then fade the toast away
        pillEl.classList.add("final");
        fadeTimer = setTimeout(() => {
          wrapEl.classList.remove("visible");
          hideTimer = setTimeout(() => {
            invoke("hide_live_toast").catch(() => {});
          }, 260);
        }, 1400);
      } else if (kind === "interim") {
        // Live typing state: animated bars + blinking caret (default pill)
      } else {
        pillEl.classList.add("status"); // Connecting… / Listening…
      }
    }

    if (listenEvent) {
      listenEvent("live-toast", (event) => {
        const payload = event.payload || {};
        setState(payload.kind || "status", payload.text || "");
      });
    }

    // Initial paint (window stays hidden until the first dictation session)
    setState("status", "Listening…");
  </script>
</body>
</html>
